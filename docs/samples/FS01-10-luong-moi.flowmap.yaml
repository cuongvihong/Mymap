- {id: S2H, type: start, subtype: user, group: R2, code: Start, title: HQ User mở menu Top-up, body: 'Admin Portal có ba tab: Individual Top-Up, Bulk Campaigns, Top-Up History. Chỉ MOE HQ User có quyền, School User không thấy menu.', fix: 'Admin Portal, menu Top-up', section: '§3.1.1, BR-F2-01'}
