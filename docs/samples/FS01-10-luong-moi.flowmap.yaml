- {id: S5U, type: start, subtype: user, group: R5, code: Start, title: School user mở Upload applications, body: School user nhập Mẫu đơn FAS in sẵn mà phụ huynh điền tay. Chỉ nhận đơn khi có form FAS đang mở., fix: 'Admin Portal, menu Upload applications', section: '§1, §3'}
- {id: S6U, type: start, subtype: user, group: R6, code: Start, title: User mở Budget và Statistics, body: 'MOE HQ User quản lý MOEFAS, School User quản lý SBFAS của trường mình. Mỗi người chỉ thấy dữ liệu trong phạm vi của mình.', fix: 'Admin Portal, trang ngân sách và thống kê', section: §1.1}
- {id: STP, type: start, subtype: user, group: R8, code: Start, title: Parent mở e-Service, body: 'Vào Landing page, chọn Log in with SingPass.', fix: 'e-Service Portal, Landing page', section: §3 bước 1}
- id: F1A
  type: fnc
  group: R1
  code: R1 · F01
  title: Tạo Education Account tự động
  body: Lấy công dân Singapore từ Government API, kiểm tra dữ liệu bắt buộc và trùng theo NRIC, tạo Student Profile và EA trạng thái Active, số dư SGD 0.00.
  fix: Job đồng bộ, bước kiểm tra dữ liệu bắt buộc và chống trùng
  chips: [Daily job, Mock Gov API, NRIC]
  section: §1.1.4 đến §1.1.11
- id: F1B
  type: fnc
  group: R1
  code: R1 · F02
  title: Kiểm tra và đóng EA
  body: Mọi thao tác backend chạm vào EA đều gọi kiểm tra này trước. Đủ 16 tuổi hoặc mất quốc tịch thì đóng. Còn số dư thì hoãn đóng vì chưa có chuyển CPF.
  fix: Hàm Closure Eligibility Check dùng chung cho mọi API đọc hoặc ghi EA
  chips: [Closure check, Mock Gov API]
  section: §1.2
- id: F2A
  type: fnc
  group: R2
  code: R2 · F2.1
  title: Tìm và xác minh chủ tài khoản
  body: HQ User nhập Account Number hoặc NRIC đầy đủ, khớp chính xác, không tìm gần đúng. Hiện tên, NRIC che một phần, tuổi, trạng thái và số dư. EA không Active vẫn xem được nhưng không nhập được số tiền.
  fix: Màn SCR-01, SCR-02, API tìm EA
  chips: [MSG-0201, MSG-0204]
  section: §3.1.2 bước 1, BR-F2-02
- id: F2B
  type: fnc
  group: R2
  code: R2 · F2.2
  title: Top-up lẻ cho một EA
  body: Nhập số tiền lớn hơn 0, tối đa 2 chữ số thập phân, xem lại rồi xác nhận. Tạo transaction có Reference ID, ghi có số dư một lần, ghi audit. Thất bại thì số dư không đổi.
  fix: Màn SCR-02 đến SCR-04, service ghi có và chống ghi trùng
  chips: [Reference ID, Audit log, SGD]
  section: §3.1.2 bước 2 đến 3, BR-F2-03 đến 06
- id: F2C
  type: fnc
  group: R2
  code: R2 · F2.3
  title: Top-Up History và Top-Up Summary
  body: Liệt kê top-up lẻ và top-up từ bulk, lọc theo nguồn, trạng thái, tên học sinh. Ba thẻ Total Spending, Successful, Failed tính theo bộ lọc. Chỉ để xem, không chặn ghi có.
  fix: Màn SCR-05, SCR-11, SCR-12, API tổng hợp Summary
  chips: [Export CSV, Summary]
  section: §3.1.1, BR-F2-07
- id: F2D
  type: fnc
  group: R2
  code: R2 · F2.4
  title: Cấu hình Campaign
  body: 'Tạo và sửa campaign: tên, criterion tùy chọn (Age Range 7 đến 15, Account Balance) và số tiền cố định mỗi tài khoản. Lưu ở trạng thái Draft, mã CMP-YYYY-NNNN. Criterion kết hợp bằng AND.'
  fix: Màn SCR-07, SCR-08, service campaign
  chips: [Draft, RowVersion]
  section: §3.1.1, BR-F2-13 đến 18
- id: F2E
  type: fnc
  group: R2
  code: R2 · F2.5
  title: Preview danh sách eligible
  body: 'Hiện các EA Active thỏa criterion tại thời điểm xem: tên, tuổi, số dư, số tiền dự kiến, tổng số tài khoản và tổng tiền. Chỉ tham khảo, không có nút Confirm, không bắt buộc trước khi chạy.'
  fix: Màn SCR-09, truy vấn danh sách eligible
  chips: [Chỉ đọc]
  section: §3.1.1, BR-F2-19
- id: F2F
  type: fnc
  group: R2
  code: R2 · F2.6
  title: Run Campaign
  body: Bấm Run Campaign ở danh sách thì tạo ngay một batch (Pending rồi Running). Lần đầu chuyển campaign từ Draft sang Active. Không eligible thì báo MSG-0214 và không tạo batch.
  fix: Nút Run Campaign ở SCR-07, service tạo batch
  chips: [Chống bấm đúp, MSG-0215]
  section: §3.1.1, BR-F2-20 đến 22
- id: F2G
  type: fnc
  group: R2
  code: R2 · F2.7
  title: Thực thi batch và theo dõi
  body: 'Xử lý từng EA theo Account Number tăng dần, theo từng đoạn nhỏ: kiểm tra EA còn Active, đánh giá lại criterion, ghi có. Kết quả mỗi EA là Successful hoặc Failed. Batch tiếp tục sau khi server khởi động lại.'
  fix: Worker chạy batch, bảng topup_run_items
  chips: [Resume, Batch summary, Audit log]
  section: §3.1.1, BR-F2-24 đến 30
- id: F3A
  type: fnc
  group: R3
  code: R3 · F01 đến F07
  title: Quản lý trường, lớp, học sinh
  body: HQ tạo School và School User. School User tạo Level, Class, nhập Student và gán vào lớp. Chuyển lớp, chuyển trường do HQ cập nhật.
  fix: Admin Portal, các màn School, Class, Student
  chips: [Admin Portal, Enrolment]
  section: §2 F01 đến F07
- id: F3B
  type: fnc
  group: R3
  code: R3 · F08
  title: Liên kết học sinh với EA
  body: Học sinh Singaporean được gán vào lớp thì hệ thống tìm EA do R1 tạo và liên kết. Liên kết một lần, không đổi số dư.
  fix: Bước sau khi tạo enrolment. Chưa chốt cách xử lý khi EA chưa có hoặc đã đóng (Q16)
  chips: [Tự động sau enrolment]
  section: §2 F08
- id: F3C
  type: fnc
  group: R3
  code: R3 · F09 đến F11
  title: Cấu hình loại phí, component, mức phí
  body: HQ tạo Fee Type, Fee Component với điều kiện nhận phí (Eligibility) và Rate Rule. Là dữ liệu nền cho việc phát hành phí.
  fix: Admin Portal, các màn Fee Type, Fee Component, Rate
  chips: [Admin Portal, GST]
  section: §2 F09 đến F11
- id: F3D
  type: fnc
  group: R3
  code: R3 · F12 đến F14
  title: Phát hành phí và tìm người nhận
  body: HQ tạo Fee Publication, chọn đối tượng nhận. Hệ thống lấy enrolment hiệu lực tại eligibility_date để tìm học sinh nhận phí.
  fix: Màn Fee Publication, service Recipient Resolution
  chips: [Publication, Recipient]
  section: §2 F12 đến F14
- id: F3E
  type: fnc
  group: R3
  code: R3 · F15
  title: Sinh và quản lý Student Charge
  body: 'Sinh Student Charge cho từng người nhận: DRAFT rồi POSTED, có thể VOID. Chỉ charge POSTED mới hiện cho phụ huynh.'
  fix: Service sinh charge, bảng student_charges. Nhiều điểm chờ khách hàng trả lời (Q02 đến Q19)
  chips: [Charge, GST]
  section: §2 F15
- id: F3F
  type: fnc
  group: R3
  code: R3 · FL-F09, FL-F10
  title: Import CSV và xem tổng quan ghi danh
  body: School User import CSV để tạo cấu trúc học vụ, học sinh, gán lớp, có Import Preview và kết quả lỗi. Enrolment Overview cho School, HQ và Parent xem theo quyền. Hoãn sang sprint sau.
  fix: Chức năng bổ sung theo Feature List, trạng thái Deferred
  chips: [Deferred]
  section: §5
- id: F4A
  type: fnc
  group: R4
  code: R4 · F4 §3 §4
  title: Danh sách đơn FAS
  body: MOE HQ thấy đơn của mọi trường (chỉ xem). School Admin chỉ thấy đơn SBFAS của học sinh đang học tại trường, không thấy MOEFAS. Có tab, bộ lọc, thẻ thống kê, Export CSV, drawer chi tiết.
  fix: Màn FAS applications, drawer chi tiết
  chips: [10 dòng/trang, Export CSV]
  section: §3, §4
- id: F4B
  type: fnc
  group: R4
  code: R4 · F4 §2.1
  title: Phân luồng đơn lúc nộp
  body: Nhận đơn từ F5 và F10. Chỉ cho nộp khi form MOEFAS hoặc SBFAS của trường đang mở. Nhóm quốc tịch ngoài scheme MOEFAS thì thành SBFAS Pending ngay. Còn lại là MOEFAS Pending, System check Waiting.
  fix: Service tiếp nhận đơn, phân luồng
  chips: [Pending, Waiting]
  section: §2.1
- id: F4C
  type: fnc
  group: R4
  code: R4 · F4 §2.2
  title: Xếp hạng và duyệt MOEFAS tự động
  body: 'Khi form đóng, xếp hạng đơn Pending theo PCI thấp nhất, rồi GHI thấp nhất, rồi nộp sớm nhất. Xét lần lượt: đạt thì Approved, không đạt thì SBFAS Pending (nếu phụ huynh đồng ý) hoặc Rejected. Gửi email kết quả.'
  fix: Job xếp hạng và quyết định sau khi form MOEFAS đóng
  chips: [Priority n of N, Auto]
  section: §2.2
- id: F4E
  type: fnc
  group: R4
  code: R4 · F4 §6
  title: Trường duyệt hoặc từ chối SBFAS
  body: School Admin xem drawer, chọn tier (một scheme SBFAS của trường) rồi Approve, hoặc Reject kèm lý do và ghi chú. Quyết định đầu tiên là quyết định cuối. Phụ huynh nhận email.
  fix: Hộp thoại Approve SBFAS, Reject
  chips: [Comment 500, Tier]
  section: §2.3, §6
- id: F4F
  type: fnc
  group: R4
  code: R4 · F4 §7
  title: Quản lý scheme FAS
  body: MOE HQ quản lý scheme MOEFAS, mỗi trường quản lý scheme SBFAS (mỗi tier một scheme). Wizard 3 bước General, Eligibility, Subsidy, lưu Draft rồi Publish. Form phải đóng trước khi scheme có hiệu lực.
  fix: Màn MOEFAS schemes, SBFAS schemes và wizard
  chips: [Wizard 3 bước, Publish]
  section: §7.1 đến 7.3
- id: F4G
  type: fnc
  group: R4
  code: R4 · F4 §7.4
  title: Add fee vào scheme đã publish
  body: Thêm fee component vào scheme Active hoặc Upcoming, dùng cho khoản phí phát sinh cuối năm. Không xoá hay sửa component đã có. Áp trợ cấp cho các khoản phí đang mở của học sinh đã được cấp scheme.
  fix: Hộp thoại Add fee
  chips: [Active, Upcoming]
  section: §7.4
- id: F4H
  type: fnc
  group: R4
  code: R4 · F4 §8
  title: Áp trợ cấp sau quyết định
  body: Khi Approved, áp trợ cấp theo cấp (MOEFAS) hoặc theo khối (SBFAS) lên các khoản phí chưa trả trong kỳ hiệu lực và phí phát hành sau. Cập nhật thẻ thống kê, đơn chuyển sang chỉ đọc.
  fix: Service áp trợ cấp lên Student Charge
  chips: [Effective from]
  section: §8
- id: F5A
  type: fnc
  group: R5
  code: R5 · §3 §4
  title: Upload scans và đọc bản scan
  body: Thêm tối đa 5 file PDF, JPG, PNG (10 MB mỗi file) cho một đơn. Bấm Upload and read thì đọc mẫu đơn, tô vàng các trường không chắc chắn. Engine OCR thật nằm ngoài phạm vi, prototype mô phỏng.
  fix: Danh sách Upload applications, hộp thoại Upload scans
  chips: [PDF/JPG/PNG, 10 MB, 5 file]
  section: §3, §4
- id: F5B
  type: fnc
  group: R5
  code: R5 · §5
  title: Review application, Part 1 đến 5
  body: Nhập NRIC người khai và từng con thì tự điền từ hồ sơ rồi khoá. Khai thành viên gia đình, context, cam kết. Tra thu nhập từ dữ liệu Chính phủ, hiện GHI và PCI. Có Save draft và Discard.
  fix: Màn Review application
  chips: [Tự điền, GHI/PCI]
  section: §5, BR3, BR4
- id: F5C
  type: fnc
  group: R5
  code: R5 · §6
  title: Kiểm tra hợp lệ trước khi nộp
  body: Chặn khi thiếu trường bắt buộc, con ngoài 7 đến 16 tuổi, con đã có đơn trong năm, không con nào học tại trường, trùng NRIC, hoặc không có form FAS nào đang mở.
  fix: Bước Review and submit
  chips: [Ghi chú đỏ]
  section: §6
- id: F5D
  type: fnc
  group: R5
  code: R5 · §7
  title: Review before submitting và nộp
  body: Hộp thoại xem lại Applicant, Children, Household, Context. Confirm and submit tạo một đơn cho mỗi con (nguồn Paper, chung mã gia đình), phân luồng theo F4, xoá bản nháp.
  fix: Hộp thoại Review before submitting
  chips: [BR7, Mỗi con một đơn]
  section: §2 bước 5, §7
- id: F5E
  type: fnc
  group: R5
  code: R5 · §8
  title: Xem và sửa đơn đã nộp
  body: Mở View application chỉ đọc. Chỉ Edit được khi đơn còn Pending. Save changes ghi History Paper application edited. Luồng quyết định không chạy lại.
  fix: Màn View application
  chips: [Chỉ khi Pending]
  section: §8
- id: F6A
  type: fnc
  group: R6
  code: R6.1.1 đến R6.1.3
  title: Thiết lập và xem ngân sách
  body: 'MOE HQ User nhập Budget Amount cho MOEFAS, School User cho SBFAS của trường mình. Hệ thống lưu và hiện Budget Amount đã cấu hình. Còn chờ chốt: kỳ ngân sách, chỉnh sửa, lịch sử.'
  fix: Màn Manage Budget, bảng ngân sách theo FAS Type và School
  chips: [Budget Amount, 'Chờ chốt G1, G2']
  section: §5.1 đến 5.3
- id: F6B
  type: fnc
  group: R6
  code: R6.2.1 đến R6.2.3
  title: Thống kê subsidy đã granted
  body: Tổng hợp Total Subsidy Amount Granted theo loại FAS trong phạm vi người dùng. Cách tính (Grant Amount hay số đã chi) và các cột bảng chưa chốt.
  fix: Trang Subsidy Statistics
  chips: ['Chờ chốt G4, G5']
  section: §5.4 đến 5.6
- id: F6C
  type: fnc
  group: R6
  code: R6.3.1 đến R6.3.3
  title: Theo dõi sử dụng ngân sách
  body: Hiện Budget Amount, Subsidy Amount Used, Remaining Budget đề xuất bằng Budget Amount trừ Subsidy Amount Used. Budget gần hết hoặc hết thì cảnh báo nhưng không chặn grant.
  fix: Trang Budget Tracking
  chips: [Remaining, Chỉ cảnh báo]
  section: §5.7 đến 5.9, R6-11
- id: F8A
  type: fnc
  group: R8
  code: R8 · FR-08.1
  title: Đăng nhập SingPass
  body: SingPass trả NRIC. Hệ thống gọi API dữ liệu theo NRIC để lấy Parent và các con, lần đầu thì tạo tài khoản, rồi cập nhật dữ liệu mới nhất của Parent đó.
  fix: Luồng đăng nhập e-Service, lớp tích hợp SingPass và API dữ liệu
  chips: [SingPass mock, Timeout 10 giây]
  section: §5 FR-08.1
- id: F8B
  type: fnc
  group: R8
  code: R8 · FR-08.2
  title: Home và xem EA của con
  body: 'Mỗi con một thẻ Edu Account: tên, mã EA, số dư. Chọn thẻ để mở Edu Account Detail. Top-up hiện là Money in. Con đủ 16 tuổi chỉ được xem. Menu toàn cục: Home, Đơn FAS, Hồ sơ phụ huynh.'
  fix: e-Service Portal, màn Home. Luồng mới theo bản đề xuất 24/10/2026
  chips: [e-Service, Đề xuất mới]
  section: §5 FR-08.2, §6.1, §6.2; UX 24/10/2026
- id: F8C
  type: fnc
  group: R8
  code: R8 · FR-08.3
  title: Sửa My details
  body: Parent sửa số điện thoại, email, địa chỉ nhận thư. Họ tên, NRIC, địa chỉ cư trú lấy từ SingPass nên chỉ đọc.
  fix: e-Service Portal, màn My details
  chips: [Audit log]
  section: §5 FR-08.3
- id: F8D
  type: fnc
  group: R8
  code: UX · Đề xuất
  title: Edu Account Detail, điểm bắt đầu của từng con
  body: 'Trang trung tâm của một con: thông tin tài khoản và số dư EA. Từ đây chọn việc cần làm: xem biến động EA, trả phí, hoặc (tương lai) hóa đơn và thanh toán. Breadcrumb Home, tên con và mã EA, Back về đúng trang này.'
  fix: Trang mới /accounts/:accountId, dùng danh sách tài khoản và wallet balance hiện có. Chưa triển khai
  chips: [Đề xuất 24/10/2026, Hub]
  section: Userflow §01
- id: F8E
  type: fnc
  group: R8
  code: UX · Đề xuất
  title: Hoạt động số dư EA của một con
  body: Ghi có và ghi nợ ví của con đã chọn, dùng lịch sử EA hiện có, có phân trang. Chỉ thể hiện bút toán ví, không suy ra nguồn Online và không gọi là toàn bộ invoice payments.
  fix: Tái dùng /transactions?student=...
  chips: [Đề xuất, Một con]
  section: Userflow §01, §03
- id: F8F
  type: fnc
  group: R8
  code: UX · Đề xuất
  title: Hoạt động EA gần đây của các con
  body: Lối tắt phụ từ Home, xem gộp nhiều con, mỗi dòng có tên con và mã EA. Chọn tên con để sang lịch sử của con đó. Phạm vi là dữ liệu đã tải (tối đa 100 bút toán mỗi tài khoản), không tuyên bố là toàn bộ lịch sử.
  fix: Tái dùng /transactions, đổi vai trò thành màn tổng hợp
  chips: [Đề xuất, Tối đa 100/tài khoản]
  section: Userflow §01, §04
- id: F9A
  type: fnc
  group: R9
  code: R9 · F9.1, F9.2
  title: Xem invoice chưa trả
  body: Liệt kê con đã liên kết, hiện invoice Issued của con kèm số dư EA. Mỗi dòng invoice là một Student Charge của R3.
  fix: e-Service Portal, màn chọn con và danh sách phí
  chips: [SCR-01, SCR-02]
  section: §3.1.2 bước 1 đến 3
- id: F9B
  type: fnc
  group: R9
  code: R9 · F9.3
  title: Chọn cách thanh toán
  body: EA, Online hoặc Both (chia đôi), hiện rõ số tiền của từng nguồn. Số dư EA nhỏ hơn số phải trả thì tắt lựa chọn chỉ EA và đề xuất chia đôi, phần EA bằng toàn bộ số dư.
  fix: e-Service Portal, màn chọn phương thức và xác nhận
  chips: [SCR-04, SCR-05]
  section: §3.1.2 bước 4 đến 6
- id: F9C
  type: fnc
  group: R9
  code: R9 · F9.4
  title: Trả bằng EA
  body: Gọi sổ cái Function 1 trừ tiền một lần theo FundingReference. Thành công thì invoice Paid, lỗi thì invoice về Issued.
  fix: Nhánh EA trong service thanh toán
  chips: [Idempotency key]
  section: §3.1.2 bước 6, BR-F9-03
- id: F9D
  type: fnc
  group: R9
  code: R9 · F9.5, F9.6
  title: Trả online và nhận kết quả
  body: Tạo phiên thanh toán ở provider sandbox. Kết quả về qua webhook ký HMAC, kèm job hỏi lại provider cho các nhánh còn Pending.
  fix: Nhánh online, endpoint webhook và job đối soát
  chips: [Webhook HMAC, Sandbox]
  section: §3.1.2 bước 6, 7, BR-F9-06
- id: F9E
  type: fnc
  group: R9
  code: R9 · F9.7
  title: Kết quả, biên lai, hoàn EA
  body: Mọi nhánh thành công thì Paid. Biên lai hiện mã invoice, tổng tiền, phương thức và số tiền từng nguồn (ví dụ 100 = EA 60 + Online 40), có đường quay về Edu Account Detail hoặc khoản phí của đúng con. Chia đôi mà online hỏng thì hoàn phần EA. Kết quả không rõ hoặc hoàn lỗi thì ReconciliationRequired.
  fix: Màn kết quả và job xử lý reversal
  chips: [SCR-06, SCR-07, SCR-08]
  section: §3.1.2 bước 7, Phụ lục A
- id: F10A
  type: fnc
  group: R10
  code: R10 · §3 §10
  title: Trang Financial assistance và bản nháp
  body: Apply for FAS khi chưa có nháp, Resume draft hoặc Discard draft khi đã có. Apply bị khoá khi mọi con đã 16 tuổi, đã có đơn Pending, hoặc không có form FAS nào đang mở. Mỗi phụ huynh một bản nháp.
  fix: e-Service, trang Financial assistance
  chips: [1 nháp mỗi phụ huynh]
  section: §3, §10
- id: F10B
  type: fnc
  group: R10
  code: R10 · §4
  title: Bước 1 Children
  body: Thông tin phụ huynh tự điền, chỉ đọc. Chọn quan hệ với con và các con nộp đơn. Con bị khoá khi 16 tuổi, đã có đơn đang xét, hoặc form đã đóng.
  fix: Wizard bước 1
  chips: [Quan hệ bắt buộc]
  section: §4, BR1, BR2
- id: F10C
  type: fnc
  group: R10
  code: R10 · §5
  title: Bước 2 Household và thu nhập
  body: Phụ huynh, vợ hoặc chồng và các con tự có trong bảng. Thêm thành viên khác (tên, NRIC, giới tính). Thu nhập lấy từ dữ liệu Chính phủ, không tự khai. Hiện GHI, số người, PCI và hoàn cảnh hộ cho engine chấm điểm.
  fix: Wizard bước 2
  chips: [Gov income, GHI/PCI]
  section: §5, BR3
- id: F10D
  type: fnc
  group: R10
  code: R10 · §6 §7
  title: Bước 3 Documents và bước 4 Context
  body: Tài liệu tuỳ chọn (PDF hoặc ảnh, 5 MB mỗi file), ô tick cũng xét SBFAS khi không đủ MOEFAS (mặc định tick). Context tối đa 2000 ký tự, người xét đơn thấy ở F4.
  fix: Wizard bước 3 và 4
  chips: [5 MB, 2000 ký tự]
  section: §6, §7
- id: F10E
  type: fnc
  group: R10
  code: R10 · §8
  title: Bước 5 Review và Submit
  body: Xem lại Applicant, Children, Household, What happens next, Context. Tick xác nhận rồi Submit application, tạo một đơn cho mỗi con (chung mã FAM-YYYY-NNNNN), phân luồng theo F4, xoá nháp.
  fix: Wizard bước 5
  chips: [Xác nhận bắt buộc, FAM-YYYY-NNNNN]
  section: §8, BR4, BR7
- id: F10F
  type: fnc
  group: R10
  code: R10 · §9
  title: My applications và timeline
  body: Mỗi đơn gia đình một thẻ. Mỗi con có timeline Submitted, System check, Review, Decision. Pending hiện là Under review. Phụ huynh nhận email sau mỗi quyết định.
  fix: Trang My applications
  chips: [Timeline, Email]
  section: §9, BR8
- id: F9F
  type: fnc
  group: R9
  code: UX · Tương lai
  title: Hóa đơn và thanh toán (tương lai)
  body: 'Kho lịch sử: mỗi invoice một dòng gồm Invoice, Số tiền, Ngày thanh toán, Phương thức. Mở dòng để xem payment và các nguồn tiền bên trong (Education Account, Online gateway). Chưa hiện menu vì chưa có nguồn danh sách payment đầy đủ.'
  fix: Nhánh nét đứt, cần danh sách có liên kết invoice, payment, con, funding sources
  chips: [Tương lai, Chưa có nguồn dữ liệu]
  section: Userflow §03, §04
- {id: Q4B, type: req, group: R4, code: BR1, title: Chỉ nộp khi có form đang mở, body: Chỉ nộp được đơn khi form MOEFAS hoặc form SBFAS của trường học sinh đang mở. Áp dụng cho F5 và F10., section: §9 BR1}
- {id: Q4A, type: req, group: R4, code: BR2, title: MOEFAS chỉ do hệ thống quyết định, body: 'Sau khi form MOEFAS đóng, theo thứ tự PCI thấp nhất, rồi GHI thấp nhất, rồi nộp sớm nhất. Không người dùng nào duyệt hay từ chối MOEFAS.', section: §9 BR2}
- {id: Q4C, type: req, group: R4, code: BR3, title: Form đóng trước khi scheme có hiệu lực, body: Effective from phải sau Form closes., section: §9 BR3}
- {id: Q2A, type: req, group: R2, code: BR-F2-04, title: Chỉ EA Active nhận top-up, body: 'EA Closed bị từ chối, số dư không đổi, transaction Failed được ghi log.', section: §3.1.1 BR-F2-04}
- {id: Q2B, type: req, group: R2, code: DA-14, title: Mỗi campaign một batch Running, body: 'Khi batch đang Running, Run Campaign và Edit của campaign bị vô hiệu (MSG-0215).', section: §1.3 DA-14}
- {id: Q6A, type: req, group: R6, code: 'BR6.06, R6-11', title: Hết budget không chặn grant, body: 'Budget gần hết hoặc hết chỉ cảnh báo, không chặn việc grant.', section: '§3, §2'}
- id: GOV
  type: ext
  group: R1
  code: External
  title: Government Citizen API (mock)
  body: NRIC, ngày sinh, quốc tịch, NRIC cha mẹ, thu nhập (CPF) của người khai và thành viên hộ. Dùng ở R1, R5, R8, R10.
  fix: Lớp tích hợp Government API
  chips: [Mock Sprint 1]
  fs: FS01.md
  section: FS01 §1.1.2, FS05 BR4, FS10 BR3
- {id: SGP, type: ext, group: R8, code: External, title: SingPass (mock), body: 'Xác thực Parent, trả NRIC, họ tên, địa chỉ cư trú.', fix: Lớp tích hợp SingPass, fs: FS08.md, section: §2.4}
- {id: PRV, type: ext, group: R9, code: External, title: Online Payment Provider, body: 'Sandbox giả lập success, failure, cancel. Gửi kết quả qua webhook.', fix: Cấu hình provider sandbox, fs: FS09.md, section: '§1.2, DA-01'}
- {id: DEA, type: tech, subtype: database, group: R1, code: Database, title: Student Profile và Education Account, body: 'Hồ sơ học sinh, mã EA, trạng thái, số dư. Liên kết qua Student id.', fix: 'Bảng Student Profile, Education Account', fs: FS01.md, section: FS01 §1.1.8}
- {id: DCH, type: tech, subtype: database, group: R3, code: Database, title: Student Charge, body: 'Khoản phải thu: base, tax, total, trạng thái DRAFT, POSTED, VOID. FS09 gom các charge thành invoice.', fix: Bảng student_charges. Chưa có cột trạng thái thanh toán (Q19), fs: FS03.md, section: 'FS03 F15, FS09 DA-05'}
- {id: DPR, type: tech, subtype: database, group: R8, code: Database, title: Parent_Profile, body: 'Thông tin Parent, liên kết với con qua NRIC cha hoặc mẹ.', fix: Bảng Parent_Profile, fs: FS08.md, section: FS08 Phụ lục A}
- id: LDG
  type: tech
  subtype: api
  group: R1
  code: R1 · Sổ cái EA
  title: 'Sổ cái EA: ghi nợ và hoàn'
  body: 'API của Function 1: trừ số dư và ghi sổ cái nguyên tử, hoàn khi giao dịch không xong. Idempotent theo FundingReference.'
  fix: Service sổ cái EA của Function 1
