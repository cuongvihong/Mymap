- {id: DTX, type: tech, subtype: database, group: R9, code: Database, title: 'Invoice, Transaction, Funding leg', body: Mỗi lần trả là một transaction với nhánh EA và nhánh online. Một invoice chỉ có một giao dịch đang mở., fix: 'Bảng invoice, transaction, funding leg', fs: FS09.md, section: 'FS09 §4.2, BR-F9-09'}
- {id: DTU, type: tech, subtype: database, group: R2, code: Database, title: Top-Up Transaction, body: 'Bảng topup_transactions: Reference duy nhất, nguồn Individual hoặc Bulk, số tiền, trạng thái Pending, Success, Failed, lý do lỗi.', fix: Bảng topup_transactions, fs: FS02.md, section: FS02 §4.2}
- {id: DCP, type: tech, subtype: database, group: R2, code: Database, title: 'Campaign, Criterion, Batch, Batch Item', body: 'Bảng topup_campaigns, topup_campaign_criteria, topup_campaign_runs, topup_run_items. Batch giữ snapshot số tiền và phiên bản định nghĩa lúc chạy.', fix: Bốn bảng topup_*, fs: FS02.md, section: FS02 §4.2}
- {id: DAL, type: tech, subtype: database, group: R2, code: Database, title: Audit log, body: 'Ghi người thực hiện, hành động, đối tượng, giá trị cũ và mới, thời điểm. Lưu vĩnh viễn, không xoá cứng.', fix: Bảng AuditLog, fs: FS02.md, section: FS02 BR-F2-30}
- {id: DAP, type: tech, subtype: database, group: R4, code: Database, title: FAS Application và History, body: 'Đơn FAS (APP-YYYY-NNNNN), nguồn Paper hoặc Online, mã gia đình, trạng thái Pending, Approved, Rejected, quyết định, hạng ưu tiên, context và History.', fix: 'Bảng đơn FAS, History, quyết định', fs: FS04.md, section: 'FS04 §2, §3'}
- {id: DSC, type: tech, subtype: database, group: R4, code: Database, title: FAS Scheme và Subsidy, body: 'Scheme MOEFAS và SBFAS: thời gian mở form, thời gian hiệu lực, điều kiện (quốc tịch, GHI, PCI), trợ cấp theo cấp hoặc khối cho từng fee component.', fix: 'Bảng scheme, eligibility, subsidy', fs: FS04.md, section: FS04 §7}
