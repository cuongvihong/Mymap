  code: Engine
  title: FAS Scoring và Decision Engine
  body: Engine rule-based chạy cho mọi đơn. Chỉ trả tier SBFAS gợi ý và ML risk (Need Score), không bao giờ tự quyết định.
  fix: Service chấm điểm
  chips: [Rule-based, Chỉ tham khảo]
