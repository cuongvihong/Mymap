- {id: DDR, type: tech, subtype: database, group: R5, code: Database, title: Bản nháp đơn FAS, body: 'Nháp lưu theo trường kèm người lưu và thời gian. R5 xoá khi nộp hoặc Discard. R10 mỗi phụ huynh một nháp, lưu bước hiện tại.', fix: Bảng draft đơn, fs: FS05.md, section: 'FS05 BR6, FS10 §10'}
- {id: DBU, type: tech, subtype: database, group: R6, code: Database, title: Ngân sách FAS, body: Budget Amount của MOEFAS và của SBFAS theo từng trường., fix: Bảng ngân sách, fs: FS06.md, section: FS06 BR6.03}
- {id: ESK, type: end, subtype: warn, group: R1, code: End, title: Không tạo EA, body: 'Không phải công dân, ngoài độ tuổi, thiếu dữ liệu bắt buộc, hoặc đã có EA.', fs: FS01.md, section: 'FS01 AF01 đến AF03, EF02'}
- {id: E02, type: end, subtype: fail, group: R8, code: MSG-0802, title: Đăng nhập không xong, body: 'SingPass lỗi hoặc Parent hủy, quay lại trang đăng nhập.', fs: FS08.md, section: FS08 §5}
- {id: E01, type: end, subtype: fail, group: R8, code: 'MSG-0801, MSG-0809', title: Không vào được hệ thống, body: 'Không tìm thấy Parent, Parent không có con, hoặc API quá 10 giây.', fs: FS08.md, section: 'FS08 §5, AC 3, 23'}
- {id: E16, type: end, subtype: warn, group: R8, code: Chỉ xem, title: Con đủ 16 tuổi, body: 'Xem EA, phí, lịch sử. Không thanh toán, không nộp FAS.', fs: FS08.md, section: 'FS08 §3 bước 7, AC 7'}
- {id: ENB, type: end, subtype: warn, group: R9, code: Không đủ số dư, title: Không đủ số dư, body: 'Hiện lý do, gợi ý trả online hoặc chia đôi. Không dữ liệu nào thay đổi.', fs: FS09.md, section: FS09 AC-04}
- {id: EPD, type: end, subtype: ok, group: R9, code: Paid, title: Invoice đã thanh toán, body: Có mã tham chiếu và biên lai PDF., fs: FS09.md, section: 'FS09 AC-03, AC-13'}
- {id: EFL, type: end, subtype: fail, group: R9, code: Failed, title: Invoice về Issued, body: 'Không thu tiền, phần EA đã trừ được hoàn. Cho thử lại hoặc thoát.', fs: FS09.md, section: 'FS09 AC-09, AC-17'}
- {id: ERC, type: end, subtype: warn, group: R9, code: ReconciliationRequired, title: Chờ vận hành xử lý, body: 'Invoice giữ PaymentPending, Parent thấy trạng thái đang xác minh.', fs: FS09.md, section: FS09 AC-18}
- {id: E2OK, type: end, subtype: ok, group: R2, code: MSG-0207, title: Top-up thành công, body: 'Số dư tăng đúng một lần, có Reference, số dư mới và audit log.', fs: FS02.md, section: 'FS02 AC-03, AC-07'}
- {id: E2FL, type: end, subtype: fail, group: R2, code: MSG-0208, title: Top-up thất bại, body: 'Số dư không đổi, transaction Failed kèm lý do, cho thử lại.', fs: FS02.md, section: 'FS02 AC-04, AC-10'}
- {id: E2NF, type: end, subtype: warn, group: R2, code: MSG-0201, title: Không tìm thấy EA, body: 'Account Number hoặc NRIC không có EA, nhập thiếu hay thừa ký tự. Không hiện gợi ý nào.', fs: FS02.md, section: FS02 AC-02}
- {id: E2BC, type: end, subtype: ok, group: R2, code: Completed, title: Batch Completed, body: 'Hết danh sách, không còn batch item Failed. Mở lại Edit và Run Campaign.', fs: FS02.md, section: FS02 Phụ lục A}
- {id: E2BF, type: end, subtype: warn, group: R2, code: Failed, title: Batch Failed, body: 'Hết danh sách nhưng còn item Failed (EA_NOT_ACTIVE, CRITERIA_NOT_MATCH, CREDIT_FAILED). Số dư các EA đó không đổi.', fs: FS02.md, section: FS02 AC-26 đến AC-29}
- {id: E2NO, type: end, subtype: warn, group: R2, code: MSG-0214, title: Không có tài khoản eligible, body: 'Không tạo batch, Batches Run không đổi.', fs: FS02.md, section: FS02 AC-38}
- {id: E4WT, type: end, subtype: warn, group: R4, code: Pending, title: Đơn MOEFAS chờ form đóng, body: 'Pending, System check Waiting. Phụ huynh thấy Under review kèm ngày form đóng.', fs: FS04.md, section: 'FS04 §2.1, T1'}
- {id: E4AP, type: end, subtype: ok, group: R4, code: Approved, title: Đơn Approved, body: 'MOEFAS không tier hoặc SBFAS kèm tier. Trợ cấp áp từ Effective from, phụ huynh nhận email.', fs: FS04.md, section: 'FS04 §2.4, §8'}
- {id: E4RJ, type: end, subtype: fail, group: R4, code: Rejected, title: Đơn Rejected, body: 'Có lý do và ghi chú, phụ huynh nhận email. Đơn chuyển sang chỉ đọc.', fs: FS04.md, section: 'FS04 §2.4, BR11'}
